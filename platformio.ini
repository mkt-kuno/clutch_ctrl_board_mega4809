; PlatformIO Project Configuration File for ATmega4809 (Crystal-less / Internal 20MHz / UPDI)
; Standard Arduino Framework (MegaCoreX)

[platformio]
default_envs = atmega4809_internal_20mhz

[env:atmega4809_internal_20mhz]
platform = atmelmegaavr
board = ATmega4809
framework = arduino

; 内部オシレータ 20MHz動作 (Crystal-less)
board_build.f_cpu = 20000000L
board_hardware.oscillator = internal

; -----------------------------------------------------------------------------
; ハードウェア・ヒューズ設定 (MegaCoreX)
; -----------------------------------------------------------------------------
board_hardware.bod = 4.3v           ; 20MHz動作の安全電圧監視 (4.3V以下でリセット、暴走防止)
board_hardware.eesave = yes          ; フラッシュ書き込み時にEEPROM保護
board_hardware.rstpin = updi         ; 【最重要】PF6をUPDI専用に固定 (文鎮化防止)
board_hardware.uart = no_bootloader  ; ブートローダなし (SerialUPDI直接駆動)

; 書き込みプロトコル (SerialUPDI: 一般的なUSB-UART変換器 + 4.7kΩ抵抗/ダイオード)
upload_protocol = serialupdi
upload_flags =
    -b
    115200

monitor_speed = 115200